##############################################################################
# render.yaml — Workforce Insights Dashboard
#
# Deploy on Render:
#   1. Push this repo to GitHub.
#   2. Go to https://dashboard.render.com → New → Blueprint.
#   3. Connect your repo; Render will detect this file automatically.
#   4. In the Render dashboard, set the env vars marked sync: false
#      (DB_PASSWORD, DB_USER, DB_HOST, GROQ_API_KEY) before the first deploy.
##############################################################################

services:
  # --------------------------------------------------------------------------
  # Backend — FastAPI (Python)
  # Serves: /chat, /analytics/*, /predictions/*
  # --------------------------------------------------------------------------
  - type: web
    name: workforce-backend
    runtime: python
    region: oregon
    plan: free          # 512 MB RAM; spins down after 15 min of inactivity

    rootDir: .

    # Build: install deps, then build the TF-IDF + FAISS vectorstore
    buildCommand: >-
      pip install -r requirements.txt &&
      python -c "import sys; sys.path.insert(0, 'RAG'); exec(open('RAG/create_vectorstore.py').read())"

    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      # ── Database ──────────────────────────────────────────────────────────
      - key: DB_USER
        sync: false       # set real value in Render dashboard
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_SSL
        value: "true"

      # ── LLM — Groq (free, no billing required) ────────────────────────────
      # Sign up at https://console.groq.com → API Keys → Create
      - key: GROQ_API_KEY
        sync: false

      # ── LLM fallback — Google Gemini Flash (free) ─────────────────────────
      # Get key at https://aistudio.google.com → Get API key
      - key: GOOGLE_API_KEY
        sync: false

      # ── Python version ────────────────────────────────────────────────────
      - key: PYTHON_VERSION
        value: "3.11.0"

  # --------------------------------------------------------------------------
  # Frontend — FastAPI / Uvicorn (Python)
  # Serves: dashboard, employees, predictions, recommendations pages
  # --------------------------------------------------------------------------
  - type: web
    name: workforce-frontend
    runtime: python
    region: oregon
    plan: free

    rootDir: .

    buildCommand: pip install -r requirements.txt

    # Frontend/app.py reads BACKEND_URL env var; falls back to localhost
    startCommand: uvicorn Frontend.app:app --host 0.0.0.0 --port $PORT

    envVars:
      # Automatically wired to the backend service's public URL by Render
      - key: BACKEND_URL
        fromService:
          name: workforce-backend
          type: web
          property: host

      - key: PYTHON_VERSION
        value: "3.11.0"
